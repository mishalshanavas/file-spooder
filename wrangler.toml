name = "file-spooder"
main = "worker.js"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "files.mishalshanavas.in/*", zone_name = "mishalshanavas.in" }
]

[vars]

# Bind R2 bucket
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "public-files"

[observability]
enabled = true
head_sampling_rate = 0.1

[[ratelimits]]
name = "AUTH_FAILURE_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "2002"
simple = { limit = 300, period = 60 }
